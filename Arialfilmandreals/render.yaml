# Render blueprint — the backend lives in its own folder: server/
# Deploy: Render → New → Blueprint → select this repository.

services:
  - type: web
    name: arialfilmandreals-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health

    envVars:
      # --- database (MongoDB Atlas) ---
      - key: MONGODB_URI
        sync: false # paste your mongodb+srv://… connection string
      - key: MONGODB_DB
        value: arialfilmandreals

      # --- admin access (MongoDB-only auth) ---
      - key: ADMIN_SECRET
        generateValue: true # signs session tokens
      - key: ADMIN_SETUP_KEY
        sync: false # required for the one-time password setup
      - key: ADMIN_EMAIL
        sync: false # where OTP codes are sent

      # --- email delivery for login codes (Resend, free tier) ---
      - key: RESEND_API_KEY
        sync: false
      - key: OTP_FROM
        value: onboarding@resend.dev
      - key: OTP_ENABLED
        value: "true"

      # --- media uploads (Cloudinary) ---
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      - key: NODE_VERSION
        value: 20
