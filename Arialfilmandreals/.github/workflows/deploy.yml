name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          # Repository secrets → Settings → Secrets and variables → Actions
          VITE_ADMIN_PASSWORD_SHA256: ${{ secrets.VITE_ADMIN_PASSWORD_SHA256 || secrets.ADMIN_PASSWORD_SHA256 }}
          VITE_ADMIN_SETUP_KEY: ${{ secrets.VITE_ADMIN_SETUP_KEY || secrets.ADMIN_SETUP_KEY }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload build
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
